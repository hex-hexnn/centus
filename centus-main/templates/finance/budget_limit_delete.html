{% extends "base.html" %}
{% block title %}Usuń limit{% endblock %}

{% block content %}
<h2 class="mb-3">Usuń limit</h2>

<div class="alert alert-warning">
  Czy na pewno chcesz usunąć limit: <strong>{{ obj.category.name }}</strong> ({{ obj.month|date:"Y-m" }})?
</div>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Usuń</button>
  <a class="btn btn-secondary" href="{% url 'budget_limits' %}">Anuluj</a>
</form>
{% endblock %}
